<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/jpg" href="fotor-ai-202502050269.jpg">
  <title>Epic Shop</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://sheetdb.io;">
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <ul id="nav-links">
      <li><a href="#">Home</a></li>
      <li><a href="#">Products</a></li>
      <li><a href="javascript:void(0);" onclick="toggleLoginForm()" id="login-btn">Login</a></li>
      <li><a href="javascript:void(0);" onclick="toggleSignupForm()" id="signup-btn">Sign Up</a></li>
    </ul>
  </nav>

  <header>
    <h1>Epic Shop</h1>
    <h2>We sell anything you imagine</h2>
  </header>

  <section id="login-form-section" class="login-form-section">
    <div class="login-form-container">
      <h2>Login</h2>
      <form id="login-form" action="?" method="post" onsubmit="login(event)">
        <input type="text" id="login-username" placeholder="Username" required /><br />
        <input type="password" id="login-password" placeholder="Password" required /><br />
        <button type="submit">Login</button>
      </form>
      <button onclick="toggleLoginForm()">Close</button>
    </div>
  </section>

  <section id="signup-form-section" class="signup-form-section">
    <div class="signup-form-container">
      <h2>Sign Up</h2>
      <form id="signup-form" action="?" method="post" onsubmit="signup(event)">
        <input type="text" id="first-name" placeholder="First Name" required /><br />
        <input type="text" id="last-name" placeholder="Last Name" required /><br />
        <input type="email" id="email" placeholder="Email" required /><br />
        <input type="password" id="new-password" placeholder="New Password" required /><br />
        <button type="submit">Sign Up</button>
      </form>
      <button onclick="toggleSignupForm()">Close</button>
    </div>
  </section>

  <main>
    <section class="product-buttons">
      <button onclick="myFunction()">Epic Juice</button>
      <button onclick="myFunction()">Epic Man</button>
      <button onclick="myFunction()">Skip School</button>
      <button onclick="myFunction()">Skip a Lesson</button>
      <button style="color: gold;" onclick="myFunction()">Get VIP</button>
      <button onclick="myFunction()">Eating Pass</button>
      <button onclick="myFunction()">Epic Calculator</button>
      <button onclick="myFunction()">Toilet Pass</button>
    </section>
  </main>

  <footer>
    <p id="demo"></p>
    <div class="user-input">
      <input type="text" id="userInput" placeholder="Type something here..." />
      <button onclick="submitInput()">Submit</button>
    </div>
  </footer>

  <section id="account-details" class="account-details">
    <div class="account-details-container">
      <h2>Account Details</h2>
      <div id="account-info"></div>
      <button onclick="toggleAccountDetails()">Close</button>
    </div>
  </section>

  <script>
    let i = 0;
    const txt = 'To pay, use your credit card or debit card, then wait 7 days ("A Week") for the arrival of your items.';
    const speed = 50;

    function myFunction() {
      if (i < txt.length) {
        document.getElementById("demo").textContent += txt.charAt(i);
        i++;
        setTimeout(myFunction, speed);
      }
    }

    function submitInput() {
      const userInput = document.getElementById("userInput").value;
      if (userInput) {
        alert(`You typed: ${userInput}`);
        document.getElementById("userInput").value = "";
      }
    }

    function toggleLoginForm() {
      const loginFormSection = document.getElementById("login-form-section");
      loginFormSection.classList.toggle("active");
    }

    function toggleSignupForm() {
      const signupFormSection = document.getElementById("signup-form-section");
      signupFormSection.classList.toggle("active");
    }

    function toggleAccountDetails() {
      const accountDetailsSection = document.getElementById("account-details");
      accountDetailsSection.classList.toggle("active");
    }

    function updateNavbar(user) {
      if (!user) return;
      document.getElementById("login-btn").style.display = "none";
      document.getElementById("signup-btn").style.display = "none";

      const existingAccount = document.getElementById("nav-account-item");
      if (existingAccount) existingAccount.remove();

      const navLinks = document.getElementById("nav-links");
      const accountItem = document.createElement("li");
      accountItem.id = "nav-account-item";
      const accountLink = document.createElement("a");
      accountLink.href = "javascript:void(0);";
      accountLink.textContent = `Account (${user.firstName} ${user.lastName})`;
      accountLink.onclick = () => showAccountDetails(user.firstName, user.lastName, user.email);
      accountItem.appendChild(accountLink);
      navLinks.appendChild(accountItem);
    }

    window.addEventListener("DOMContentLoaded", () => {
      const sessionUser = JSON.parse(localStorage.getItem("session"));
      if (sessionUser) {
        updateNavbar(sessionUser);
      }
    });

    async function hashPassword(password) {
      const encoder = new TextEncoder();
      const data = encoder.encode(password);
      const hashBuffer = await crypto.subtle.digest("SHA-256", data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, "0")).join("");
    }

    async function signup(event) {
      event.preventDefault();
      const firstName = document.getElementById("first-name").value;
      const lastName = document.getElementById("last-name").value;
      const email = document.getElementById("email").value;
      const password = document.getElementById("new-password").value;

      if (password.length < 8) {
        alert("Password must be at least 8 characters long.");
        return;
      }

      const hashedPassword = await hashPassword(password);

      // Save user details to localStorage
      const user = {
        firstName,
        lastName,
        email,
        password: hashedPassword,
      };
      localStorage.setItem("user", JSON.stringify(user));

      // Send data to Google Sheets via API
      const formData = new FormData();
      formData.append("firstName", firstName);
      formData.append("lastName", lastName);
      formData.append("email", email);
      formData.append("password", hashedPassword);

      fetch("https://sheetdb.io/api/v1/dkwhpad2d0bif", {
        method: "POST",
        body: formData,
      })
        .then((response) => response.json())
        .then((data) => {
          console.log("Success:", data);
          alert("Signup proccess successful!");
          localStorage.setItem("session", JSON.stringify(user));
          updateNavbar(user);
          toggleSignupForm();
        })
        .catch((error) => {
          console.error("Error:", error);
          alert("An error occurred during signup.");
        });
    }

    async function login(event) {
      event.preventDefault();
      const username = document.getElementById("login-username").value;
      const password = document.getElementById("login-password").value;

      const hashedPassword = await hashPassword(password);

      // Retrieve user details from localStorage
      const user = JSON.parse(localStorage.getItem("user"));

      if (user && user.email === username && user.password === hashedPassword) {
        alert("Login successful!");
        localStorage.setItem("session", JSON.stringify(user));
        updateNavbar(user);
        showAccountDetails(user.firstName, user.lastName, user.email);
        toggleLoginForm();
      } else {
        alert("Invalid username or password.");
      }
    }

    function showAccountDetails(firstName, lastName, email) {
      const accountInfo = document.getElementById("account-info");
      accountInfo.innerHTML = ""; // Clear previous content safely

      const fields = [
        { label: "First Name", value: firstName },
        { label: "Last Name", value: lastName },
        { label: "Email", value: email },
      ];

      fields.forEach(field => {
        const p = document.createElement("p");
        const strong = document.createElement("strong");
        strong.textContent = `${field.label}: `;
        p.appendChild(strong);
        p.appendChild(document.createTextNode(field.value));
        accountInfo.appendChild(p);
      });

      toggleAccountDetails();
    }
  </script>

</body>
</html>
